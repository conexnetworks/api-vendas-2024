# Compose de produção: a API, o Postgres e o Redis, sem nenhuma porta publicada.
# Uso: docker compose --env-file .env.production -f compose.prod.yaml up -d --build

# Nome próprio: sem ele, o projeto teria o nome da pasta, o mesmo do compose de desenvolvimento, e os dois
# dividiriam os volumes (o Postgres de produção montaria os dados do Postgres de desenvolvimento).
name: api-vendas-2024-prod

services:
  api:
    build: .
    image: api-vendas-2024
    restart: unless-stopped
    init: true
    env_file: .env.production
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_started }

  db:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASS:?}
      POSTGRES_DB: ${DB_NAME:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      retries: 30

  cache:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # Simula o Amazon SES (não existe numa produção de verdade, que usa a AWS)
  localstack:
    image: localstack/localstack:4.14.0
    restart: unless-stopped
    environment:
      - SERVICES=ses
    volumes:
      - ./localstack/verify-ses-identity.sh:/etc/localstack/init/ready.d/verify-ses-identity.sh

volumes:
  postgres_data:
  redis_data:
